version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mil_sabores_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: super_secret_password123
      POSTGRES_DB: mil_sabores_db
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mil_sabores_redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mil_sabores_rabbitmq
    restart: always
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}

volumes:
  postgres_data:
